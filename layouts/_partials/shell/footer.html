<footer class="site-footer">

    <span class="site-brand__mark" aria-hidden="true"></span>
    <span class="ui-index">ARCHIVE / PUBLIC</span>
  </div>

  <div class="site-footer__content">
    <span>
      {{ site.Copyright
        | default (printf "© %d %s" now.Year site.Title) }}

    <a href="{{ site.Home.RelPermalink }}">返回阅览大厅</a>
  </div>

  <div class="site-footer__status">
    <span>STATIC BUILD / HUGO</span>
  </div>
</footer>
