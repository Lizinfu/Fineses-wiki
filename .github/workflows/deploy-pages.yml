name: Build and deploy Hugo Wiki

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.155.3"
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Hugo Extended
        shell: bash
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"

          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "${url}"

          tar \
            --extract \
            --gzip \
            --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}" \
            hugo

          sudo install \
            --mode 0755 \
            "${RUNNER_TEMP}/hugo" \
            /usr/local/bin/hugo

          hugo version

      - name: Install Wiki dependencies
        run: npm ci

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Validate content data
        run: npm run wiki:validate

      - name: Check source quality budget
        run: npm run quality:source

      - name: Generate relationship and timeline data
        run: npm run wiki:prepare

      - name: Build Hugo site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --cleanDestinationDir \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build Pagefind search index
        run: npx pagefind --site public

      - name: Verify Pagefind bundle
        run: node scripts/verify-search-index.mjs

      - name: Check rendered site quality
        run: npm run quality:site

      - name: Run browser accessibility and navigation checks
        run: npm run test:browser

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## Wiki build complete"
            echo
            echo "- Content graph and timeline data generated"
            echo "- Hugo site built"
            echo "- Pagefind search index generated and verified"
            echo "- Deployment URL: ${{ steps.pages.outputs.base_url }}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
