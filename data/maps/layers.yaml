# 程序化六边形地图。陆地瓦片由参考图生成，网站运行时不加载底图。
maps:
  - id: world
    title: "世界总图"
    page_ref: "portals/atlas/"
    type: hex
    level: 0
    mask_id: world
    grid:
      columns: 136
      rows: 60
      hex_size: 24
      gap: 0.9
      orientation: flat
    min_zoom: 0.08
    max_zoom: 16
    default_zoom: 0.72
    default_center:
      col: 67.5
      row: 29.5
    wrap_x: true
    appearance:
      palette: political-pastel
      relief: subtle
      material: paper

