  # 白色圆点只确定城市位置；城区外缘是可替换的暂定示意范围。
  city.cathair:
    input: "assets/map-sources/inibholc-political.png"
    output: "data/maps/tiles.yaml"
    grid:
      columns: 36
      rows: 20
    urban_footprint:
      parent_mask_id: nation.inibholc
      parent_area_id: city.cathair.nation
      parent_location_id: loc.cathair
      area_id: city.cathair
      marker_image: [0.481, 0.725]
      center_parent: [22, 20]
      radius_parent: [2.8, 1.5]
