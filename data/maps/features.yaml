        source: owner-2026-11-07
        geometry_status: provisional
        description: 城市以皇宫为中心组织环路与放射道路。河流由西北流向东南，在皇宫外围分流环绕为护城河；西部以工业建筑为主，东部以住宅为主，内城密集、外城疏朗，外围为高耸的素面城墙与岗哨。普通建筑采用抽象白色体块，皇宫以都柏林城堡的庭院、圆塔与礼拜堂体量为参考；建筑细节、河道及街坊形状为可编辑的美术规划。
